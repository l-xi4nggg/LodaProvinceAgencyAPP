<script>
let adminSection='media',branches=[],branchEditing=null,branchLimit=30,analyticsSnapshot=null;
const branchFields={name:'branchName',code:'branchCode',province:'branchProvince',district:'branchDistrict',sale:'branchSale',phone:'branchPhone',map:'branchMap',profile:'branchProfile',lat:'branchLat',lng:'branchLng'};
function branchFormData(){return Object.fromEntries(Object.entries(branchFields).map(([key,id])=>[key,$(id).value]));}
function editBranch(item=null){branchEditing=item;for(const[key,id]of Object.entries(branchFields))$(id).value=item?.[key]??'';$('branchDialog').showModal();}
function renderBranches(){const query=$('branchSearch').value.normalize('NFC').toLowerCase(),visible=branches.filter(item=>(!item.deleted||$('showHiddenBranches').checked)&&[item.name,item.code,item.province,item.district,item.sale].join(' ').normalize('NFC').toLowerCase().includes(query));$('branchCount').textContent=visible.length+' '+t('results');$('branchList').replaceChildren(...visible.slice(0,branchLimit).map(item=>{const card=el('article');card.className='card branch-admin-card';if(item.profile){const image=el('img');image.src=item.profilePreview||item.profile;image.alt=item.name;image.loading='lazy';card.append(image);}card.append(el('h3',item.name+' · '+item.code),el('p',[item.province,item.district].filter(Boolean).join(' · ')),el('p',item.phone||'—'));if(item.deleted)card.append(el('span',t('hidden')));const actions=el('div');actions.className='actions';actions.append(button(t('edit'),()=>editBranch(item)),button(t(item.deleted?'showBranch':'hideBranch'),async()=>{try{await rpc('setBranchVisibility',adminToken,item.id,!item.deleted);item.deleted=!item.deleted;renderBranches();}catch(error){message(error.message,true);}}));card.append(actions);return card;}));$('moreBranches').hidden=visible.length<=branchLimit;}
async function loadBranches(){try{branches=(await rpc('getAdminBranches',adminToken)).items;renderBranches();}catch(error){message(error.message,true);}}
window.lodaRefreshBranches=loadBranches;
async function saveBranchForm(changePhoto=false){const submit=$('branchForm').querySelector('button[type=submit]');submit.disabled=true;$('branchChangePhoto').disabled=true;try{if(!$('branchForm').reportValidity())return;const result=await rpc('saveBranch',adminToken,branchEditing?.id||'',branchFormData());$('branchDialog').close();await loadBranches();message(t('branchSaved'));if(changePhoto)openUpload('image',{id:result.id,name:result.name,category:'Agency Profile',subcategory:'Agent Logo'},result.id);}catch(error){message(error.message,true);}finally{submit.disabled=false;$('branchChangePhoto').disabled=false;}}
function renderAnalytics(){if(!analyticsSnapshot)return;$('analyticsNotice').hidden=analyticsSnapshot.enabled;$('analyticsNotice').textContent=t('analyticsDisabled');const days=analyticsSnapshot.days||[],views=days.reduce((sum,day)=>sum+day.views,0),visits=days.reduce((sum,day)=>sum+day.visits,0);const todayKey=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),today=days.find(day=>day.date===todayKey);$('analyticsSummary').replaceChildren(...[[t('views')+' · '+t('last30'),views],[t('visits')+' · '+t('last30'),visits],[t('views')+' · '+t('today'),today?.views||0]].map(([label,value])=>{const card=el('div');card.className='summary-card';card.append(el('small',label),el('strong',String(value)));return card;}));$('analyticsRows').replaceChildren(...days.slice().reverse().map(day=>{const row=el('tr');row.append(el('td',day.date),el('td',String(day.views)),el('td',String(day.visits)));return row;}));$('analyticsEmpty').hidden=!!days.length;}
async function selectSection(section){adminSection=section;for(const name of['media','branches','analytics']){$(name+'Panel').hidden=name!==section;$(name+'Tab').setAttribute('aria-selected',String(name===section));}if(section==='branches')await loadBranches();if(section==='analytics')try{analyticsSnapshot=await rpc('getAdminAnalytics',adminToken);renderAnalytics();}catch(error){message(error.message,true);}}
for(const name of['media','branches','analytics']){
 const tab=$(name+'Tab');tab.setAttribute('aria-controls',name+'Panel');tab.onclick=()=>selectSection(name);
 tab.onkeydown=event=>{const names=['media','branches','analytics'];if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const index=event.key==='Home'?0:event.key==='End'?2:(names.indexOf(name)+(event.key==='ArrowRight'?1:2))%3;$(names[index]+'Tab').focus();selectSection(names[index]);};
}
$('newBranch').onclick=()=>editBranch();$('branchSearch').oninput=()=>{branchLimit=30;renderBranches();};$('showHiddenBranches').onchange=renderBranches;$('moreBranches').onclick=()=>{branchLimit+=30;renderBranches();};$('closeBranch').onclick=()=>$('branchDialog').close();$('branchForm').onsubmit=event=>{event.preventDefault();saveBranchForm();};$('branchChangePhoto').onclick=()=>saveBranchForm(true);
window.addEventListener('loda:preferences',()=>{if(adminSection==='branches')renderBranches();if(adminSection==='analytics')renderAnalytics();});
</script>
