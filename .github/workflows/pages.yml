name: Publish LODA agency app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify source and backend behavior
        run: |
          node scripts/check.cjs
          node --test tests/*.test.cjs
      - name: Version application scripts for browser caches
        run: sed -i -E "s/(src=\"(data|config|app)\.js)\"/\1?v=$GITHUB_SHA\"/g" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
